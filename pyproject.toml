[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_media_indexer"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "ai-media-indexer"
version = "0.1.0"
description = "AI Media Indexer with SOTA Speech Recognition (Whisper) and Voice Intelligence"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "faster-whisper>=1.1.0",
    "hf-transfer>=0.1.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "librosa>=0.10.0",
    "onnx>=1.16.1",
    "ml_dtypes>=0.4.0,<0.6.0",
    "ollama>=0.6.1",
    "packaging",
    "pydantic>=2.10.0",

    "scikit-learn>=1.5.0",
    "transformers>=4.46.3",
    "torch>=2.5.1",
    "torchaudio>=2.5.1",
    "torchvision>=0.20.1",
    "python-dotenv>=1.2.1",
    "pydantic-settings>=2.6.0",
    "qdrant-client>=1.16.2",
    "sentence-transformers>=3.3.0",
    "ctranslate2>=4.6.1",
    "mcp>=1.23.2",
    "websockets>=15.0.1",
    "httpx>=0.28.1",
    # OpenAI-compatible client library — used by VLLMProvider/VLLMVLMClient/VLLMText
    # to call vLLM (or any OpenAI-compat endpoint) without vendoring the HTTP layer.
    "openai>=1.0.0",
    "langfuse>=3.11.0",
    "loguru>=0.7.2",
    "numpy>=1.26.0",
    "numba>=0.60.0",
    "opencv-python-headless>=4.8.0",
    "uvicorn>=0.38.0",
    "fastapi>=0.124.2",
    "pillow>=12.0.0",
    "pyannote.audio>=4.0.0",  # 4.x removes torchaudio.AudioMetaData dep; compatible with torchaudio 2.9+
    "psutil>=5.9.0",
    # insightface moved to optional [enrichment] group.
    # Install with: uv sync --group enrichment
    # Controlled by settings.enable_face_recognition (default: True).
    "onnxruntime>=1.16.0",
    "hdbscan>=0.8.36",
    "easyocr>=1.7.1",
    "instructor>=1.13.0",
    "nvidia-ml-py>=12.535.0",
    "celery[redis]>=5.3.6",
    "redis>=5.0.1",
    # Phase 2: chunk_state persistent table (idempotent checkpoints)
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    # sam3 removed: conflicts with pyannote.audio>=4.0.0 via numpy<2 constraint.
    # sam3_tracker.py falls back to sam2 or mocks gracefully when sam3 is absent.
    # Re-add when sam3 publishes a PyPI release with numpy>=2 support.
    # "brave-search>=0.1.0", # Removed due to httpx conflict

    "ultralytics>=8.3.0",
    "paddleocr>=2.9.1 ; python_version < '3.14'",

    "rank_bm25>=0.2.2",
    "tf-keras>=2.16.0 ; python_version < '3.14'",  # Required for transformers compatibility with Keras 3
    "scenedetect>=0.6.0",

    "open-clip-torch>=3.2.0",
    "setuptools<70.0.0",

    "opencv-python>=4.11.0.86",
    "paddlepaddle>=3.3.0 ; python_version < '3.14'",

]

[project.optional-dependencies]
# Enrichment models: InsightFace (face recognition) and Speech Emotion Recognition.
# These are off by default to keep the default install footprint small.
# Enable in config: enable_face_recognition=True / enable_speech_emotion=True
# Install: uv sync --group enrichment
enrichment = [
    "insightface>=0.7.3",
    # SER (Speech Emotion Recognition) — Wav2Vec2 via HuggingFace:
    # transformers is already a core dep, so no extra package needed.
    # The model is downloaded on first use when enable_speech_emotion=True.
]

dev = [
    "black>=24.0.0",
    "ruff>=0.6.0",
    "cmake>=3.20.0",
    "cython>=3.0.0",
    "ninja>=1.11.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",     # HTTP mocking for vLLM/httpx tests
    "fakeredis>=2.23.0", # In-memory Redis for fan-in tests
    "aiosqlite>=0.19.0", # Async SQLite driver for repository tests
    "mypy>=1.10.0",
    "pyright>=1.1.380",
]

[tool.black]
line-length = 80
target-version = ["py312"]
skip-string-normalization = false

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "C4"]
ignore = ["E501", "B008", "B904", "B905", "E402", "B027", "N806", "E722", "E731", "B007", "F401"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["ai_media_indexer"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
line-ending = "lf"

[tool.uv]
cache-dir = ".uv_cache"
concurrent-downloads = 5
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'"]


[tool.pyright]
typeCheckingMode = "basic"
reportAttributeAccessIssue = "none"
reportOptionalMemberAccess = "none"
reportArgumentType = "none"
reportIncompatibleMethodOverride = "none"
reportPossiblyUnboundVariable = "none"
reportOptionalCall = "none"
reportIndexIssue = "none"
reportReturnType = "none"
reportGeneralTypeIssues = "none"
reportOptionalSubscript = "none"
reportCallIssue = "none"
reportMissingImports = "none"
reportUndefinedVariable = "none"
reportIncompatibleVariableOverride = "none"
reportOperatorIssue = "none"
reportFunctionMemberAccess = "none"
reportUnusedExpression = "none"
reportPrivateImportUsage = "none"
reportAbstractUsage = "none"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"

